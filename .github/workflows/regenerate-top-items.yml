name: Regenerate Top Items List

on:
  # Manual trigger only
  workflow_dispatch:

# Prevent conflicts with other workflows
concurrency:
  group: regenerate-top-items
  cancel-in-progress: false  # Let it complete

jobs:
  regenerate:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required to commit changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Fetch ALL trade data (full 90 days)
        run: |
          echo "⏳ Fetching complete trade data for all shop items..."
          echo "   This will take 15-30 minutes depending on API response times."
          python scripts/fetch_trade_data.py

      - name: Generate new top items list
        run: |
          echo "📊 Analyzing trade data to select top items..."
          python scripts/generate_top_items.py

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet data/top_items.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to top items list"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Top items list has been updated"
          fi

      - name: Display changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          echo "## Top Items List Changes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`diff" >> $GITHUB_STEP_SUMMARY
          git diff data/top_items.json >> $GITHUB_STEP_SUMMARY || true
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/top_items.json
          git commit -m "Update top items list based on 30d conversion rates - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push origin main

      - name: Summary
        run: |
          echo "## Top Items List Regeneration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✓ Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Analysis Window:** 30 days" >> $GITHUB_STEP_SUMMARY
          echo "- **Selection Criteria:** Lowest conversion rate (bags/shard or bags/token)" >> $GITHUB_STEP_SUMMARY
          echo "- **Secondary Criteria:** Lowest volatility" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

          if [ -f data/top_items.json ]; then
            SHARD_ITEMS=$(python -c "import json; data=json.load(open('data/top_items.json')); print(data['metadata']['blood_shards_items'])")
            TOKEN_ITEMS=$(python -c "import json; data=json.load(open('data/top_items.json')); print(data['metadata']['blood_tokens_items'])")
            TOTAL_ITEMS=$(python -c "import json; data=json.load(open('data/top_items.json')); print(data['count'])")

            echo "- **Blood Shard Items:** $SHARD_ITEMS" >> $GITHUB_STEP_SUMMARY
            echo "- **Blood Token Items:** $TOKEN_ITEMS" >> $GITHUB_STEP_SUMMARY
            echo "- **Total Items:** $TOTAL_ITEMS" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
            echo "- **Changes:** Yes - New top items list committed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ Next Steps" >> $GITHUB_STEP_SUMMARY
            echo "1. Review the changes in the commit diff above" >> $GITHUB_STEP_SUMMARY
            echo "2. Run 'Update Top Items (Optimized)' workflow to fetch trade data for new items" >> $GITHUB_STEP_SUMMARY
            echo "3. Run trade analysis to regenerate recommendations" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Changes:** No - Top items list unchanged" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The current top items are still optimal based on recent trade data." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup
        if: always()
        run: |
          # Remove the large trade_cache.json from this run
          # (it will be regenerated by the optimized fetch workflow)
          rm -f data/trade_cache.json
          echo "Cleaned up full trade cache (will be regenerated by optimized workflow)"
