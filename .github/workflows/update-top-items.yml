name: Update Top Items (Optimized)

on:
  # Allow manual triggering only
  workflow_dispatch:

# Prevent conflicts with Pages deployment
concurrency:
  group: trade-data-update
  cancel-in-progress: true

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required to commit changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Fetch top items trade data (optimized)
        run: |
          python scripts/fetch_top_items.py

      - name: Regenerate recommendations JSON for frontend
        run: |
          python trade_economics_analysis.py

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet data/trade_cache.json data/trade_recommendations.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to data files"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Data files have been updated"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/trade_cache.json data/trade_recommendations.json
          git commit -m "Auto-update: trade data + recommendations - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push origin main

      - name: Summary
        run: |
          echo "## Trade Data Update Summary (Optimized + Auto-Regen)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✓ Success" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode:** Top 50 Items Only (Fast)" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

          if [ -f data/trade_cache.json ]; then
            TOTAL_TRADES=$(jq '.metadata.total_trades' data/trade_cache.json)
            ITEMS_WITH_TRADES=$(jq '.metadata.items_with_trades' data/trade_cache.json)
            echo "- **Total Trades:** $TOTAL_TRADES" >> $GITHUB_STEP_SUMMARY
            echo "- **Items with Trades:** $ITEMS_WITH_TRADES" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f data/trade_recommendations.json ]; then
            ACTIVE_ITEMS=$(jq '.metadata.active_items' data/trade_recommendations.json)
            echo "- **Active Items in Recommendations:** $ACTIVE_ITEMS" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
            echo "- **Changes:** Yes - Data + recommendations committed" >> $GITHUB_STEP_SUMMARY
            echo "- **Frontend:** Will auto-update on next page load" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Changes:** No - Data unchanged" >> $GITHUB_STEP_SUMMARY
          fi
